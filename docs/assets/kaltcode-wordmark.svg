<svg
  xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 600 120"
  role="img"
  aria-label="Kalt Code — Open terminal for any LLM"
>
  <!--
    Kalt Code startup wordmark.

    Mirrors the CLI startup screen:
    GLYPH    RGB(203, 186, 235) → #CBBAEB
    FIELD_BG RGB(48, 35, 78)    → #30234E

    Pure rects, generated from the ASCII startup logo.
    No font dependency for the main wordmark.
  -->

  <!-- Purple startup field -->
  <rect
    x="0"
    y="0"
    width="600"
    height="78"
    fill="#30234E"
  />

  <!-- KALT CODE -->

  <!-- Row 1 -->
  <rect x="18"  y="9" width="24" height="12" fill="#CBBAEB"/>
  <rect x="58"  y="9" width="24" height="12" fill="#CBBAEB"/>
  <rect x="90"  y="9" width="64" height="12" fill="#CBBAEB"/>
  <rect x="162" y="9" width="24" height="12" fill="#CBBAEB"/>

  <!-- T top bar -->
  <rect x="210" y="9" width="72" height="12" fill="#CBBAEB"/>

  <rect x="290" y="9" width="64" height="12" fill="#CBBAEB"/>
  <rect x="362" y="9" width="64" height="12" fill="#CBBAEB"/>
  <rect x="434" y="9" width="64" height="12" fill="#CBBAEB"/>
  <rect x="506" y="9" width="64" height="12" fill="#CBBAEB"/>

  <!-- Row 2 -->
  <rect x="18"  y="21" width="24" height="12" fill="#CBBAEB"/>
  <rect x="58"  y="21" width="24" height="12" fill="#CBBAEB"/>

  <rect x="90"  y="21" width="24" height="12" fill="#CBBAEB"/>
  <rect x="130" y="21" width="24" height="12" fill="#CBBAEB"/>

  <rect x="162" y="21" width="24" height="12" fill="#CBBAEB"/>

  <!-- T stem -->
  <rect x="234" y="21" width="24" height="12" fill="#CBBAEB"/>

  <rect x="290" y="21" width="24" height="12" fill="#CBBAEB"/>

  <rect x="362" y="21" width="24" height="12" fill="#CBBAEB"/>
  <rect x="402" y="21" width="24" height="12" fill="#CBBAEB"/>

  <rect x="434" y="21" width="24" height="12" fill="#CBBAEB"/>
  <rect x="474" y="21" width="24" height="12" fill="#CBBAEB"/>

  <rect x="506" y="21" width="24" height="12" fill="#CBBAEB"/>

  <!-- Row 3 -->
  <rect x="18" y="33" width="48" height="12" fill="#CBBAEB"/>

  <rect x="90" y="33" width="64" height="12" fill="#CBBAEB"/>

  <rect x="162" y="33" width="24" height="12" fill="#CBBAEB"/>

  <!-- T stem -->
  <rect x="234" y="33" width="24" height="12" fill="#CBBAEB"/>

  <rect x="290" y="33" width="24" height="12" fill="#CBBAEB"/>

  <rect x="362" y="33" width="24" height="12" fill="#CBBAEB"/>
  <rect x="402" y="33" width="24" height="12" fill="#CBBAEB"/>

  <rect x="434" y="33" width="24" height="12" fill="#CBBAEB"/>
  <rect x="474" y="33" width="24" height="12" fill="#CBBAEB"/>

  <rect x="506" y="33" width="64" height="12" fill="#CBBAEB"/>

  <!-- Row 4 -->
  <rect x="18"  y="45" width="24" height="12" fill="#CBBAEB"/>
  <rect x="58"  y="45" width="24" height="12" fill="#CBBAEB"/>

  <rect x="90"  y="45" width="24" height="12" fill="#CBBAEB"/>
  <rect x="130" y="45" width="24" height="12" fill="#CBBAEB"/>

  <rect x="162" y="45" width="24" height="12" fill="#CBBAEB"/>

  <!-- T stem -->
  <rect x="234" y="45" width="24" height="12" fill="#CBBAEB"/>

  <rect x="290" y="45" width="24" height="12" fill="#CBBAEB"/>

  <rect x="362" y="45" width="24" height="12" fill="#CBBAEB"/>
  <rect x="402" y="45" width="24" height="12" fill="#CBBAEB"/>

  <rect x="434" y="45" width="24" height="12" fill="#CBBAEB"/>
  <rect x="474" y="45" width="24" height="12" fill="#CBBAEB"/>

  <rect x="506" y="45" width="24" height="12" fill="#CBBAEB"/>

  <!-- Row 5 -->
  <rect x="18"  y="57" width="24" height="12" fill="#CBBAEB"/>
  <rect x="58"  y="57" width="24" height="12" fill="#CBBAEB"/>

  <rect x="90"  y="57" width="24" height="12" fill="#CBBAEB"/>
  <rect x="130" y="57" width="24" height="12" fill="#CBBAEB"/>

  <rect x="162" y="57" width="64" height="12" fill="#CBBAEB"/>

  <!-- T stem -->
  <rect x="234" y="57" width="24" height="12" fill="#CBBAEB"/>

  <rect x="290" y="57" width="64" height="12" fill="#CBBAEB"/>
  <rect x="362" y="57" width="64" height="12" fill="#CBBAEB"/>
  <rect x="434" y="57" width="64" height="12" fill="#CBBAEB"/>
  <rect x="506" y="57" width="64" height="12" fill="#CBBAEB"/>

  <!-- Tagline -->
  <text
    x="300"
    y="106"
    text-anchor="middle"
    font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace"
    font-size="14"
    font-weight="500"
    letter-spacing="0.18em"
    fill="#81759A"
  >
    OPEN TERMINAL FOR ANY LLM
  </text>
</svg>
